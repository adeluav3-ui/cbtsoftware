kind = "web"
previewPath = "/"
title = "CBT School Exam System"
version = "1.0.0"
id = "artifacts/cbt-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19478
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/cbt-app run dev"

[services.env]
PORT = "19478"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/cbt-app", "run", "build"]
publicDir = "artifacts/cbt-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
